name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Documentation checks
        run: npm run docs:check

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:ci

      - name: Build coverage hotspots report
        if: always()
        run: node scripts/coverage-hotspots.mjs

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage/lcov.info
            coverage/hotspots.txt
          if-no-files-found: warn

      - name: Upload to Codecov
        if: always()
        continue-on-error: true
        env:
          CODECOV_HEAD_LABEL: ${{ github.event.pull_request.head.label }}
          CODECOV_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          CODECOV_PR_NUMBER: ${{ github.event.pull_request.number }}
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          set -euo pipefail

          if [ ! -f ./coverage/lcov.info ]; then
            echo "coverage/lcov.info not found, skipping Codecov upload"
            exit 0
          fi

          curl -sSfL https://keybase.io/codecovsecurity/pgp_keys.asc \
            | gpg --batch --yes --no-default-keyring --keyring trustedkeys.gpg --import
          curl -sSfLO https://cli.codecov.io/latest/linux/codecov
          curl -sSfLO https://cli.codecov.io/latest/linux/codecov.SHA256SUM
          curl -sSfLO https://cli.codecov.io/latest/linux/codecov.SHA256SUM.sig
          gpg --batch --no-default-keyring --keyring trustedkeys.gpg --verify codecov.SHA256SUM.sig codecov.SHA256SUM
          sha256sum -c codecov.SHA256SUM
          chmod +x codecov

          codecov_args=(
            --verbose
            upload-process
            --disable-search
            --file ./coverage/lcov.info
            --slug "$GITHUB_REPOSITORY"
          )

          if [ -n "${CODECOV_TOKEN:-}" ]; then
            codecov_args+=(--token "$CODECOV_TOKEN")
          fi

          if [ -n "${CODECOV_PR_NUMBER:-}" ]; then
            codecov_args+=(--pull-request-number "$CODECOV_PR_NUMBER")
          fi

          if [ -n "${CODECOV_HEAD_LABEL:-}" ] && [ -n "${CODECOV_HEAD_REPO:-}" ] && [ "$CODECOV_HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            codecov_args+=(--branch "$CODECOV_HEAD_LABEL")
          fi

          ./codecov "${codecov_args[@]}"
