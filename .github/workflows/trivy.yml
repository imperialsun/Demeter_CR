name: Trivy

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  security-events: write

jobs:
  trivy-fs:
    name: Trivy FS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Trivy filesystem scan
        id: trivy_fs_scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"

      - name: Build Trivy FS text report (non-blocking)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy-fs.txt
          exit-code: "0"

      - name: Upload Trivy FS SARIF
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Publish Trivy FS summary
        if: always()
        run: |
          echo "### Trivy FS (HIGH/CRITICAL)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Detailed findings: Security > Code scanning + artifact trivy-fs-report." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Trivy FS report artifact
        if: always() && hashFiles('trivy-fs.txt') != ''
        uses: actions/upload-artifact@v7
        with:
          name: trivy-fs-report
          path: trivy-fs.txt
          if-no-files-found: warn

  trivy-image:
    name: Trivy Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t demeter-cr:ci .

      - name: Run Trivy image scan
        id: trivy_image_scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          scan-ref: demeter-cr:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"

      - name: Build Trivy image text report (non-blocking)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          scan-ref: demeter-cr:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy-image.txt
          exit-code: "0"

      - name: Upload Trivy Image SARIF
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Publish Trivy Image summary
        if: always()
        run: |
          echo "### Trivy Image (HIGH/CRITICAL)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Detailed findings: Security > Code scanning + artifact trivy-image-report." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Trivy Image report artifact
        if: always() && hashFiles('trivy-image.txt') != ''
        uses: actions/upload-artifact@v7
        with:
          name: trivy-image-report
          path: trivy-image.txt
          if-no-files-found: warn
