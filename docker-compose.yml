services:
  backend:
    build:
      context: ../Backend
      dockerfile: Dockerfile
    image: transcode-backend:latest
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - PORT=8080
      - SQLITE_PATH=/data/backend.sqlite
      - JWT_SECRET=${JWT_SECRET:-change-me}
      - ACCESS_TTL_MINUTES=${ACCESS_TTL_MINUTES:-15}
      - REFRESH_TTL_HOURS=${REFRESH_TTL_HOURS:-720}
      - COOKIE_SECURE=true
      - CORS_ORIGINS=${CORS_ORIGINS:-https://transcode.demeter-sante.fr}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - MISTRAL_API_BASE_URL=${MISTRAL_API_BASE_URL:-https://api.mistral.ai}
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-admin@demeter.local}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-ChangeMe123!}
      - BOOTSTRAP_ORG_NAME=${BOOTSTRAP_ORG_NAME:-Demeter Santé}
    volumes:
      - transcode-backend-sqlite:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.transcode-backend.rule=Host(`transcode.demeter-sante.fr`) && PathPrefix(`/api`)"
      - "traefik.http.routers.transcode-backend.entrypoints=websecure"
      - "traefik.http.routers.transcode-backend.tls=true"
      - "traefik.http.routers.transcode-backend.tls.certresolver=le"
      - "traefik.http.routers.transcode-backend.priority=200"
      - "traefik.http.routers.transcode-backend.service=transcode-backend"
      - "traefik.http.services.transcode-backend.loadbalancer.server.port=8080"
    networks:
      - proxy

  transcode:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_OBFUSCATE: "1"
    image: transcode:latest
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /config
      - /data
    cap_drop:
      - ALL
    ports:
      - "3000:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.transcode.rule=Host(`transcode.demeter-sante.fr`)"
      - "traefik.http.routers.transcode.entrypoints=websecure"
      - "traefik.http.routers.transcode.tls=true"
      - "traefik.http.routers.transcode.tls.certresolver=le"
      - "traefik.http.routers.transcode.priority=1"
      - "traefik.http.services.transcode.loadbalancer.server.port=3000"
      # Add secure headers as a Traefik middleware in case you prefer Traefik add them (redundant with runtime headers)
      - "traefik.http.middlewares.transcode-secure-headers.headers.customResponseHeaders.Cross-Origin-Opener-Policy=same-origin"
      - "traefik.http.middlewares.transcode-secure-headers.headers.customResponseHeaders.Cross-Origin-Embedder-Policy=require-corp"
      - "traefik.http.middlewares.transcode-secure-headers.headers.customResponseHeaders.Cross-Origin-Resource-Policy=same-origin"
      - "traefik.http.routers.transcode.middlewares=transcode-secure-headers"
    environment:
      - NODE_ENV=production
      - APP_RUNTIME_MODE=${APP_RUNTIME_MODE:-backend}
      - APP_BACKEND_BASE_URL=${APP_BACKEND_BASE_URL:-/api/v1}
    networks:
      - proxy

  gradio-proxy:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./docker/gradio-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.transcode-gradio.rule=Host(`transcode.demeter-sante.fr`) && PathPrefix(`/gradio_api`)"
      - "traefik.http.routers.transcode-gradio.entrypoints=websecure"
      - "traefik.http.routers.transcode-gradio.tls=true"
      - "traefik.http.routers.transcode-gradio.tls.certresolver=le"
      - "traefik.http.routers.transcode-gradio.priority=100"
      - "traefik.http.routers.transcode-gradio.service=transcode-gradio"
      - "traefik.http.routers.transcode-gradio-ui.rule=Host(`transcode.demeter-sante.fr`) && PathPrefix(`/gradio`)"
      - "traefik.http.routers.transcode-gradio-ui.entrypoints=websecure"
      - "traefik.http.routers.transcode-gradio-ui.tls=true"
      - "traefik.http.routers.transcode-gradio-ui.tls.certresolver=le"
      - "traefik.http.routers.transcode-gradio-ui.priority=90"
      - "traefik.http.routers.transcode-gradio-ui.service=transcode-gradio"
      - "traefik.http.routers.transcode-gradio-ui.middlewares=transcode-gradio-strip"
      - "traefik.http.middlewares.transcode-gradio-strip.stripprefix.prefixes=/gradio"
      - "traefik.http.services.transcode-gradio.loadbalancer.server.port=80"
    networks:
      - proxy

networks:
  proxy:
    external: true

volumes:
  transcode-backend-sqlite:
