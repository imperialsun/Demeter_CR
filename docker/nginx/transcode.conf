worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml
    application/rss+xml
    image/svg+xml
    application/wasm;

  # Keep temporary files on writable tmpfs when container rootfs is read-only.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  types {
    application/wasm wasm;
  }

  # Cache policy per path family.
  map $uri $cache_control {
    default "no-cache";
    =/runtime-config.js "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/onnx/ "public, max-age=86400, must-revalidate";
    ~^/ffmpeg/ "public, max-age=86400, must-revalidate";
    ~^/worklets/ "public, max-age=3600, must-revalidate";
  }

  server {
    listen 3000;
    listen [::]:3000;
    server_name _;
    root /srv;
    index index.html;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # ORT WASM needs wasm compilation enabled in CSP.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss: blob:; worker-src 'self' blob:; media-src 'self' data: blob:; frame-src 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Cache-Control $cache_control always;

    location /assets/ {
      try_files $uri =404;
    }

    location /onnx/ {
      try_files $uri =404;
    }

    location /ffmpeg/ {
      try_files $uri =404;
    }

    location /worklets/ {
      try_files $uri =404;
    }

    location = /runtime-config.js {
      alias /tmp/runtime-config.js;
      default_type application/javascript;
      add_header Cache-Control "no-cache" always;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
