codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  status:
    project:
      default:
        target: 80%
        threshold: 0%
        informational: true
    patch:
      default:
        target: 80%
        threshold: 0%
        informational: true

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
